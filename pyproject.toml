[project]
name = "taichimps"
version = "0.1.0"
description = "LAMMPS GRANULAR package reimplemented in Taichi Lang"
readme = "PLAN.md"
authors = [
    { name = "Makoto KUNO", email = "makomako0829bump@gmail.com" }
]
requires-python = "==3.12.*"
dependencies = [
    "taichi>=1.7.0",
    "numpy>=1.26.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.9.0",
    "mypy>=1.14.0",
]

[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"

[project.scripts]
taichimps = "taichimps.main:main"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_configs = true
disable_error_code = ["valid-type"]


